# Synthetic IT estate of a fictional mid-size bank ("Musterbank AG").
# Not a real environment. Versions are deliberately not the latest, so the
# matcher has something to find. CPE strings follow CPE 2.3; verify each one
# against the NVD CPE dictionary before relying on it (Q-2.1-04, checkpoint A).
#
# zone:        internet | dmz | internal | restricted
# criticality: critical | high | medium | low
# data_class:  payment | customer | internal | public
#
# software[].keywords (optional): phrases that name the product in CVE
# descriptions. Used only for CVEs NVD has not analysed yet (no CPE
# configuration), which the matcher then marks needs_review. Default: the CPE
# product with underscores as spaces (e.g. "linux kernel").
#
# software[].cna_sources (optional): NVD `sourceIdentifier` values of the
# organisations that file this product's CVEs (vendor PSIRT / project CNA).
# If set, an unanalysed CVE counts only when it names the product AND was filed
# by one of these sources; this drops third-party products that merely mention
# it ("hMailServer ... with a PostgreSQL database"). If omitted, keywords alone
# decide. Values taken from run 1 on the VPS (2026-11-22), CVEs NVD had analysed
# or that came from the vendor itself.

version: 1
organisation: Musterbank AG (synthetic)

hosts:
  - id: fw-edge-01
    role: Perimeter firewall and SSL VPN
    zone: internet
    criticality: critical
    data_class: internal
    owner: network-team
    software:
      - cpe: "cpe:2.3:o:fortinet:fortios:7.2.4:*:*:*:*:*:*:*"
        cna_sources:
          - "psirt@fortinet.com"
    compensating_controls:
      - SSL VPN restricted to managed devices via certificate auth
    patch_window: emergency changes within 24 h

  - id: lb-dmz-01
    role: Load balancer in front of online banking
    zone: dmz
    criticality: critical
    data_class: customer
    owner: network-team
    software:
      - cpe: "cpe:2.3:a:f5:big-ip_local_traffic_manager:16.1.3:*:*:*:*:*:*:*"
        keywords: ["big-ip"]
        cna_sources:
          - "f5sirt@f5.com"
    compensating_controls:
      - Management interface only reachable from admin VLAN
    patch_window: monthly, Sunday 02:00–06:00

  - id: web-ob-01
    role: Online banking web front end
    zone: dmz
    criticality: critical
    data_class: customer
    owner: digital-channels
    software:
      - cpe: "cpe:2.3:a:apache:tomcat:9.0.80:*:*:*:*:*:*:*"
        cna_sources:
          - "security@apache.org"
      - cpe: "cpe:2.3:a:openssl:openssl:3.0.11:*:*:*:*:*:*:*"
        cna_sources:
          - "openssl-security@openssl.org"
      - cpe: "cpe:2.3:o:linux:linux_kernel:5.15.0:*:*:*:*:*:*:*"
        cna_sources:
          - "416baaa9-dc9f-4396-8d5f-8c081fb06d67"  # kernel.org
    compensating_controls:
      - WAF in blocking mode in front of the application
    patch_window: monthly, Sunday 02:00–06:00

  - id: pay-gw-01
    role: Payments gateway (SEPA / instant payments)
    zone: restricted
    criticality: critical
    data_class: payment
    owner: payments-it
    software:
      - cpe: "cpe:2.3:a:oracle:weblogic_server:14.1.1.0.0:*:*:*:*:*:*:*"
        cna_sources:
          - "secalert_us@oracle.com"
      - cpe: "cpe:2.3:a:openbsd:openssh:9.3:p2:*:*:*:*:*:*"
        # no cna_sources: OpenSSH CVEs are filed by varying CNAs; keywords alone decide
    compensating_controls:
      - No inbound internet access; allow-listed connections to the clearing network only
    patch_window: quarterly, change advisory board approval required

  - id: db-core-01
    role: Core banking database
    zone: restricted
    criticality: critical
    data_class: customer
    owner: core-banking-it
    software:
      - cpe: "cpe:2.3:a:postgresql:postgresql:14.9:*:*:*:*:*:*:*"
        cna_sources:
          - "f86ef6dc-4d3a-42ad-8f28-e6d5547a5007"  # PostgreSQL project
    compensating_controls:
      - Database port reachable only from the core banking application servers
    patch_window: quarterly, change advisory board approval required

  - id: dc-ad-01
    role: Active Directory domain controller
    zone: internal
    criticality: critical
    data_class: internal
    owner: workplace-it
    software:
      - cpe: "cpe:2.3:o:microsoft:windows_server_2019:10.0.17763.5329:*:*:*:*:*:*:*"
        cna_sources:
          - "secure@microsoft.com"
    compensating_controls:
      - Tiered admin model; no interactive logon for standard users
    patch_window: monthly, Patch Tuesday + 7 days

  - id: virt-vc-01
    role: Virtualisation management (vCenter)
    zone: internal
    criticality: high
    data_class: internal
    owner: infrastructure
    software:
      - cpe: "cpe:2.3:a:vmware:vcenter_server:8.0:update1:*:*:*:*:*:*"
        cna_sources:
          - "security@vmware.com"
    compensating_controls:
      - Reachable only from the admin jump hosts
    patch_window: monthly

  - id: wiki-int-01
    role: Internal wiki (Confluence)
    zone: internal
    criticality: medium
    data_class: internal
    owner: workplace-it
    software:
      - cpe: "cpe:2.3:a:atlassian:confluence_data_center:8.5.1:*:*:*:*:*:*:*"
        cna_sources:
          - "security@atlassian.com"
    compensating_controls: []
    patch_window: monthly
