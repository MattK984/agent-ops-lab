[project]
name = "cve-triage"
version = "0.1.0"
description = "CVE triage agent for agent-ops-lab: NVD -> inventory match -> assessment -> pgvector memory -> digest"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.7",
    "httpx>=0.27",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=0.6",
    "langsmith>=0.4",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cve_triage"]
